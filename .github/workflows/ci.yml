name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile app.py config.py db.py embedded.py security.py server.py sources.py state.py substore.py sync.py
      - name: Unit tests
        run: python -m unittest discover -v
